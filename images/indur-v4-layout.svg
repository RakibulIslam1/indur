    <text x="47" y="77" font-size="15" fill="#93aabe">Functional top view · sensor angles illustrative · not to scale</text>
    <text x="741" y="158" font-size="16" font-weight="700" letter-spacing="2" fill="#b7f76c">FORWARD</text>
