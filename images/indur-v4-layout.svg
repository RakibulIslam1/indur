<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">INDUR V4 five-sensor and two-wheel layout</title>
  <desc id="desc">A functional top view: left, left-diagonal, front, right-diagonal, and right infrared sensors surround the front of the robot. Two driven wheels have independent magnetic encoders. The center contains an OLED, controller, and three buttons. Geometry values are firmware defaults, and the drawing is not to scale.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#b7f76c" stroke-width="1.6"/></marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#32485c" stroke-width="0.6" opacity="0.25"/></pattern>
  </defs>
  <rect width="1400" height="900" rx="24" fill="#0b1826"/>
  <rect width="1400" height="900" rx="24" fill="url(#grid)"/>
