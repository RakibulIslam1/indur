    <text x="355" y="830" font-size="16" fill="#c3d3df">Wheel Ø 35.5 mm · track 63 mm · maze cell 180 mm</text>
    <text x="66" y="852" font-size="13" fill="#91acbf">Firmware defaults, not a measured V4 mechanical drawing. Set wheel diameter and track to match your chassis.</text>
